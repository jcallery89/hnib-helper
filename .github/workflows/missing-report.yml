name: Missing headshots report

# Builds a by-team package of players whose headshot is absent from the live
# site's manifest: a listing plus each player's name-matched prior-event
# candidate photo (from the public Tourno bucket) for identity verification.
# Published as a workflow artifact with 1-day retention; contents beyond the
# bucket photos are roster-public fields (team, jersey, name, player ID) -
# no birth dates.

on:
  workflow_dispatch:
    inputs:
      current_event:
        description: Event ID to report on
        required: false
        default: 3171c084-927e-4336-bba8-41939699c738
      prior_event:
        description: Prior event ID used to flag possible matches
        required: false
        default: eb6bad98-2b24-4d9d-a191-6d9cae2ae837
  push:
    paths:
      - ".github/workflows/missing-report.yml"
      - "scripts/missing_report.py"

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CURRENT_EVENT: ${{ inputs.current_event || '3171c084-927e-4336-bba8-41939699c738' }}
      PRIOR_EVENT: ${{ inputs.prior_event || 'eb6bad98-2b24-4d9d-a191-6d9cae2ae837' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The site's bot protection intermittently blocks plain HTTP from CI,
      # so the manifest comes over FTPS like the recovery uploads do.
      - name: Fetch the site manifest over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cat > get.lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set cmd:fail-exit true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get headshots/manifest.js -o manifest.js
          bye
          EOF
          lftp -f get.lftp

      - name: Build report
        run: python scripts/missing_report.py "$CURRENT_EVENT" "$PRIOR_EVENT" --manifest manifest.js --out missing-report

      - name: Publish as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: missing-headshots-by-team
          path: missing-report/
          retention-days: 1
